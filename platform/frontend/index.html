<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarketClue · See the market differently</title>
  <meta name="description" content="Market research you can check, for solo founders. Every statement links to the exact quote it rests on, or is labelled as an assumption or an estimate.">
  <meta name="theme-color" content="#FBFAF7">
  <meta name="color-scheme" content="light">
  <script>
  // Runs before the app's modules arrive (classic script in <head>): starts the sign-in check and
  // preloads the modules the opening page needs, so neither waits for the whole module graph.
  (function () {
    // It runs before config.js (a script after a stylesheet or another script would wait for those
    // downloads), so it assumes the default /api base; api.js ignores the answers if config.js differs.
    var mock = /[?&]mock=1(&|$)/.test(location.search);
    var signedIn = false;
    try { signedIn = localStorage.getItem("mc_signed_in") === "1"; } catch (e) { /* storage blocked */ }
    var path = location.hash.split("?")[0].split("/");
    var head = path[1] || "";
    var id = path[2] ? decodeURIComponent(path[2]) : "";
    if (!mock && window.fetch) {
      var base = "/api";
      // api.js uses each of these answers for its first GET of the same path (null means "ask again").
      var early = window.__mcEarly = { base: base, at: Date.now() };
      var get = function (url) {
        early[url] = fetch(base + url, { credentials: "include" }).then(function (res) {
          return res.json().catch(function () { return null; }).then(function (data) {
            return { status: res.status, data: data };
          });
        }, function () { return null; });
      };
      get("/me");
      // Someone who was signed in last time: also fetch the page's own data now, not after the sign-in check.
      if (signedIn && id && head === "c") get("/conversations/" + encodeURIComponent(id));
      if (signedIn && id && head === "runs") get("/runs/" + encodeURIComponent(id));
    }
    // Mock mode answers API calls from mock.js; fetch it now, as production fetches /me now.
    var extra = mock ? ["mock.js"] : [];
    var research = ["research.js", "templates.js", "depth.js"];
    var report = ["run.js", "report.js", "charts.js"];
    var byRoute = {
      "": signedIn ? research : ["landing.js"], home: research, new: research, c: research,
      templates: ["templates.js"], p: ["projects.js"], runs: id ? report : ["library.js", "report.js", "charts.js"],
      shared: report, library: ["library.js", "report.js", "charts.js"], team: ["team.js"], join: ["team.js"],
    };
    (byRoute[head] || []).concat(extra).forEach(function (file) {
      var link = document.createElement("link");
      link.rel = "modulepreload";
      link.href = file;
      document.head.appendChild(link);
    });
  })();
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F4F2EA'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23242522' stroke-width='2.5'/%3E%3Cpath d='M16 5.5A10.5 10.5 0 0 0 16 26.5Z' fill='%23B13C1C'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="report.css">
  <link rel="stylesheet" href="landing.css">
  <script src="config.js"></script>
  <!-- The shell's modules, fetched in parallel instead of one import level at a time. -->
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="ui.js">
  <link rel="modulepreload" href="api.js">
  <link rel="modulepreload" href="core.js">
  <link rel="modulepreload" href="shell.js">
  <link rel="modulepreload" href="features.js">
  <link rel="modulepreload" href="projects.js">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell shell-public" id="shell">
    <header class="topbar" id="topbar"></header>
    <nav class="sidebar" id="sidebar" aria-label="Main" hidden></nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <div class="content" id="content">
      <main id="main" tabindex="-1">
        <noscript>
          <div class="page"><p>MarketClue needs JavaScript to run. Please turn it on and reload the page.</p></div>
        </noscript>
      </main>
      <footer class="site-footer">
        <p>MarketClue · Built by Yuexizi Zhang</p>
        <p class="mock-note" id="mock-note" hidden>Mock mode: sample data, not a real account</p>
      </footer>
    </div>
  </div>
  <dialog id="card-panel" class="sheet"></dialog>
  <dialog id="reading-dialog" class="dialog" aria-labelledby="reading-dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live" class="visually-hidden" aria-live="polite"></div>
</body>
</html>
