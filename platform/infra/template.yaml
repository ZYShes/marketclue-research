AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MarketClue platform prototype (author Yuexizi Zhang)

Parameters:
  GoogleClientId:
    Type: String
  OwnerEmails:
    Type: String
    Default: ""
  SiteOrigin:
    Type: String
    Default: ""
  BudgetEmail:
    Type: String
  FreeRunsPerUser:
    Type: Number
    Default: 1
  MaxRunsPerDay:
    Type: Number
    Default: 30
  PlanModel:
    Type: String
    Default: claude-opus-5-5
  ResearchModel:
    Type: String
    Default: claude-opus-5-5

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: marketclue
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: false }

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub marketclue-data-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub marketclue-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: marketclue-api
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: app.handler.lambda_handler
      CodeUri: pkg
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          DATA_BUCKET: !Ref DataBucket
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          OWNER_EMAILS: !Ref OwnerEmails
          FREE_RUNS_PER_USER: !Ref FreeRunsPerUser
          MAX_RUNS_PER_DAY: !Ref MaxRunsPerDay
          SSM_PREFIX: /marketclue
          SELF_FUNCTION_NAME: marketclue-api
          STALE_DAYS: "90"
          SITE_ORIGIN: !Ref SiteOrigin
          PLAN_MODEL: !Ref PlanModel
          RESEARCH_MODEL: !Ref ResearchModel
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref DataBucket }
        - SSMParameterReadPolicy: { ParameterName: marketclue/* }
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:marketclue-api
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      FunctionUrlConfig:
        AuthType: NONE

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: marketclue-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: MarketClue platform
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: marketclue-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 30, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 33 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 66 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  FunctionUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
